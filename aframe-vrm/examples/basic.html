<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A-Frame VRM Example</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="../dist/aframe-vrm.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #joystick-zone {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 120px;
      height: 120px;
      z-index: 10;
      display: none;
    }
    @media (hover: none) and (pointer: coarse) {
      #joystick-zone { display: block; }
    }
    .joystick-base {
      position: absolute;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      touch-action: none;
    }
    .joystick-knob {
      position: absolute;
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      left: 36px;
      top: 36px;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="joystick-zone">
    <div class="joystick-base" id="joystick-base">
      <div class="joystick-knob" id="joystick-knob"></div>
    </div>
  </div>

  <a-scene background="color: #1a1a2e">
    <!-- Basic VRM avatar -->
    <a-entity
      position="0 0 -2"
      vrm-model="src: /assets/avatar.vrm"
      vrm-expressions="happy: 0.2; surprised: 0.0"
      vrm-look-at="target: #camera; type: expression"
      vrm-spring-bone="gravity: 0 -1 0; stiffness: 1.0"
    ></a-entity>

    <!-- Networked VRM avatar (player) -->
    <a-entity
      id="player"
      position="0 0 -1"
      vrm-model="src: /assets/avatar.vrm"
      vrm-expressions="happy: 0.1; relaxed: 0.2"
      vrm-look-at="target: #camera"
      vrm-spring-bone="gravity: 0 -1 0; stiffness: 1.0"
      vrm-movement="speed: 2; verticalSpeed: 1.5; enabled: true; rotationSpeed: 2"
      vrm-networked="server: wss://example.com/vrm; room: lobby; userId: user-1"
    ></a-entity>

    <!-- Camera / LookAt target -->
    <a-entity id="camera" position="0 1.6 0">
      <a-camera look-controls="pointerLockEnabled: false" wasd-controls="enabled: false"></a-camera>
    </a-entity>

    <!-- Environment -->
    <a-sky color="#1a1a2e"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" color="#2a2a3e" roughness="0.8"></a-plane>
    <a-grid helper="size: 40; divisions: 40; colorCenterLine: #444; colorGrid: #333"></a-grid>
    <a-light type="ambient" color="#555"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.6" position="-0.5 1 1"></a-light>
  </a-scene>

  <script>
    (function() {
      // Simple on-screen joystick for mobile movement
      const base = document.getElementById('joystick-base');
      const knob = document.getElementById('joystick-knob');
      const player = document.getElementById('player');
      if (!base || !knob || !player) return;

      let active = false;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      const maxDist = 36;

      function updateKnob() {
        const dx = currentX - startX;
        const dy = currentY - startY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const angle = Math.atan2(dy, dx);
        const clamped = Math.min(dist, maxDist);
        const kx = 36 + Math.cos(angle) * clamped;
        const ky = 36 + Math.sin(angle) * clamped;
        knob.style.left = kx + 'px';
        knob.style.top = ky + 'px';

        // Inject joystick values into the movement component
        const move = player.components['vrm-movement'];
        if (move && typeof move.keys === 'object') {
          const nx = Math.cos(angle) * (clamped / maxDist);
          const ny = Math.sin(angle) * (clamped / maxDist);
          move.keys.w = ny < -0.2;
          move.keys.s = ny > 0.2;
          move.keys.a = nx < -0.2;
          move.keys.d = nx > 0.2;
        }
      }

      function resetKeys() {
        const move = player.components['vrm-movement'];
        if (move && typeof move.keys === 'object') {
          move.keys.w = false;
          move.keys.s = false;
          move.keys.a = false;
          move.keys.d = false;
        }
      }

      base.addEventListener('touchstart', function(e) {
        e.preventDefault();
        active = true;
        const t = e.changedTouches[0];
        const rect = base.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
        currentX = t.clientX;
        currentY = t.clientY;
        updateKnob();
      }, { passive: false });

      base.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (!active) return;
        const t = e.changedTouches[0];
        currentX = t.clientX;
        currentY = t.clientY;
        updateKnob();
      }, { passive: false });

      base.addEventListener('touchend', function(e) {
        e.preventDefault();
        active = false;
        knob.style.left = '36px';
        knob.style.top = '36px';
        resetKeys();
      });

      base.addEventListener('touchcancel', function(e) {
        e.preventDefault();
        active = false;
        knob.style.left = '36px';
        knob.style.top = '36px';
        resetKeys();
      });
    })();
  </script>
</body>
</html>

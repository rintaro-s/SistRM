<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SisterRM - A-Frame VRM Example</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- three.js is bundled inside A-Frame; do NOT load a separate copy -->
  <script src="./aframe-vrm.js"></script>
  <style>
    #ui-overlay {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 12px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      border-radius: 8px;
      z-index: 9999;
      max-width: 280px;
      line-height: 1.5;
    }
    #ui-overlay h3 { margin: 0 0 8px; font-size: 15px; }
    #ui-overlay .status { font-weight: bold; }
    #ui-overlay .status.ok { color: #4ade80; }
    #ui-overlay .status.err { color: #f87171; }
    #ui-overlay .status.warn { color: #facc15; }
    #ui-overlay .info { color: #94a3b8; font-size: 12px; margin-top: 8px; }
    #ui-overlay button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 12px;
    }
    #ui-overlay button:hover { background: #1d4ed8; }
    #ui-overlay button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <a-scene>
    <!-- Lighting -->
    <a-entity light="type: ambient; color: #BBB; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 2 1"></a-entity>

    <!-- Ground -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>

    <!-- Local avatar -->
    <a-entity
      id="local-avatar"
      position="0 0 -2"
      rotation="0 0 0"
      vrm-model="src: ./avatar.vrm"
      vrm-networked="server: ws://localhost:8080/ws; room: demo; userId: aframe-user-1"
    ></a-entity>

    <!-- Camera rig -->
    <a-entity position="0 1.6 2">
      <a-camera look-controls wasd-controls></a-camera>
    </a-entity>
  </a-scene>

  <div id="ui-overlay">
    <h3>SisterRM A-Frame Demo</h3>
    <div>Server: ws://localhost:8080/ws</div>
    <div>Room: demo</div>
    <div>Status: <span id="status" class="status warn">Connecting...</span></div>
    <div id="vrm-status" class="info">Loading VRM...</div>
    <div class="info" id="server-hint">
      Make sure the Go server is running:<br>
      <code>cd vrm-server && go run ./cmd/server</code>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const vrmStatusEl = document.getElementById('vrm-status');
    const serverHintEl = document.getElementById('server-hint');
    const avatarEl = document.getElementById('local-avatar');

    let vrmLoaded = false;
    let wsConnected = false;

    function updateStatus() {
      if (vrmLoaded && wsConnected) {
        statusEl.textContent = 'Ready';
        statusEl.className = 'status ok';
        serverHintEl.style.display = 'none';
      } else if (vrmLoaded && !wsConnected) {
        statusEl.textContent = 'VRM loaded, waiting for server...';
        statusEl.className = 'status warn';
      } else if (!vrmLoaded && wsConnected) {
        statusEl.textContent = 'Connected, loading VRM...';
        statusEl.className = 'status warn';
      } else {
        statusEl.textContent = 'Loading...';
        statusEl.className = 'status warn';
      }
    }

    avatarEl.addEventListener('model-loaded', (e) => {
      vrmLoaded = true;
      vrmStatusEl.textContent = 'VRM: ' + (e.detail.vrm?.meta?.name || 'loaded');
      console.log('VRM loaded:', e.detail.vrm);
      updateStatus();
    });

    avatarEl.addEventListener('model-error', (e) => {
      vrmStatusEl.textContent = 'VRM load failed: ' + (e.detail.error?.message || 'unknown error');
      vrmStatusEl.style.color = '#f87171';
      console.error('VRM load failed:', e.detail);
    });

    // Hook into network system status
    const checkNetwork = () => {
      const scene = document.querySelector('a-scene');
      if (!scene) return;
      const system = scene.systems['vrm-network-system'];
      if (system && system.client) {
        wsConnected = system.client.isConnected;
        updateStatus();
      }
    };
    setInterval(checkNetwork, 1000);
  </script>
</body>
</html>

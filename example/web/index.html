<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SisterRM - A-Frame VRM Example</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="../../aframe-vrm/dist/aframe-vrm.js"></script>
</head>
<body>
  <a-scene>
    <!-- Lighting -->
    <a-entity light="type: ambient; color: #BBB; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 2 1"></a-entity>

    <!-- Ground -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#7BC8A4"></a-plane>

    <!-- Local avatar -->
    <a-entity
      id="local-avatar"
      position="0 0 -2"
      rotation="0 0 0"
      vrm-model="src: ../assets/avatar.vrm"
      vrm-networked="server: ws://localhost:8080/ws; room: demo; userId: aframe-user-1"
    ></a-entity>

    <!-- Camera rig -->
    <a-entity position="0 1.6 2">
      <a-camera look-controls wasd-controls></a-camera>
    </a-entity>
  </a-scene>

  <script>
    // Simple UI overlay
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.7);color:white;padding:10px;font-family:monospace;z-index:9999;';
    div.innerHTML = `
      <div><b>SisterRM A-Frame Demo</b></div>
      <div>Server: ws://localhost:8080/ws</div>
      <div>Room: demo</div>
      <div id="status">Connecting...</div>
    `;
    document.body.appendChild(div);

    const el = document.getElementById('local-avatar');
    el.addEventListener('model-loaded', (e) => {
      document.getElementById('status').textContent = 'VRM loaded! Connected.';
      console.log('VRM loaded:', e.detail.vrm);
    });
  </script>
</body>
</html>
